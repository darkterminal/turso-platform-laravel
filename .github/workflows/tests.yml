name: Tests

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  tests:
    name: php ${{ matrix.php }} laravel ${{ matrix.laravel }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '^11.0' }
          - { php: '8.4', laravel: '^11.0' }
          - { php: '8.5', laravel: '^11.0' }
          - { php: '8.4', laravel: '^12.0' }
          - { php: '8.5', laravel: '^12.0' }

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" \
            --no-interaction --no-progress --no-update
          composer update --no-interaction --no-progress

      - name: Tests
        env:
          TURSO_PLATFORM_API_TOKEN: token-for-ci-resolution-unauthenticated
        run: vendor/bin/pest
